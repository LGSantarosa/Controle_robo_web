; Sonda de bancada pra placa de hoverboard NOVA (não flasheada / baud incerto).
; NÃO é firmware de robô: só escuta o pino 19 (RX1) e despeja em hex o que
; chegar, varrendo bauds. Manda sempre speed=0 — não move roda nenhuma.
;
;   pio run -t upload --upload-port /dev/ttyACM0
;   pio device monitor -b 115200 --port /dev/ttyACM0

[env:megaatmega2560]
platform      = atmelavr
board         = megaatmega2560
framework     = arduino
monitor_speed = 115200
upload_speed  = 115200
build_flags   = -std=gnu++17 -Wall -Wextra
